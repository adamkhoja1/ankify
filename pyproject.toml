[project]
name = "ankify"
version = "2.1.0"
description = "Generate high-quality spaced-repetition flashcards from sources, with a rubric-driven review loop and eval harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109",
    "openai>=2.7.1",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "fire>=0.7.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.34.0",
    "datasets>=3.2.0",
    "genanki>=0.13",
]

[project.scripts]
ankify = "ankify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.4",
    "mypy>=1.14.0",
    "types-beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankify"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests"]
